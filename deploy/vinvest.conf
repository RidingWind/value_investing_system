# ============================================================
# 价值投资自动化选股系统 - Nginx 配置
# 安装路径：/etc/nginx/conf.d/vinvest.conf
# 维护命令：
#   nginx -t                    # 测试配置
#   systemctl reload nginx      # 平滑重启
#   systemctl restart nginx     # 强制重启
# ============================================================

# ---------- HTTP 80 端口（自动跳转 HTTPS，如未配置证书可关闭） ----------
# 如尚未申请 SSL 证书，请保留下方 8080 区块，并注释掉 80/443 两个区块。

# server {
#     listen       80;
#     server_name  vinvest.example.com;
#     return 301   https://$host$request_uri;
# }

# ---------- 主服务端口（HTTP，可直接访问或作为 SLB 后端） ----------
server {
    listen       8080;
    server_name  _;
    client_max_body_size 20M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/xml+rss image/svg+xml;

    # 前端静态资源（Vue3 + Vite 构建产物）
    location / {
        root   /opt/vinvest/frontend/dist;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存（Hash 文件名，可长期缓存）
        location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }
    }

    # API 反向代理至后端 FastAPI (Uvicorn 监听 127.0.0.1:8000)
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout    300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;

        # 请求体缓冲（大文件上传场景开启）
        client_body_buffer_size 128k;
        proxy_buffering on;
        proxy_buffers 8 64k;
        proxy_buffer_size 64k;
    }

    # WebSocket / SSE 长连接（如后端需要，可直接走此路径）
    location /ws/ {
        proxy_pass         http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 健康检查
    location /health {
        access_log off;
        proxy_pass  http://127.0.0.1:8000/health;
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 日志
    access_log  /opt/vinvest/logs/nginx_access.log;
    error_log   /opt/vinvest/logs/nginx_error.log warn;
}

